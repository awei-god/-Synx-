<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS函数</title>
</head>
<body>
    <script>
        // function function_name(参数1，参数2，参数3，...){
        //     函数体;
        //     return 返回值;
        // }

        function hello(){
            console.log('hello,world');
            
        }

        hello();

        function hello_with(){
            return 'hello,world - 返回值';
        }

        let a=hello_with();
        console.log(a);
        console.log(hello_with());
        
        let b='全局变量b';
        function local_var_functions(){
            let local_var='局部变量local_var';
            console.log('函数内打印全局变量'+b);
            console.log('函数内打印局部变量'+local_var);
        }

        local_var_functions();

    </script>
    
</body>
</html>
