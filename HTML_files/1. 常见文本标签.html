<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>常见文本标签练习</title>
</head>
<body>
    <h1>一级标题标签</h1>
    <h2>二级级标题标签</h2>
    <h3>三级标题标签</h3>
    <p id="describe" class="section">标题标签一共有6个</p>
    <a href="https://baidu.com">这是一个超链接</a>
    <p>段落标签</p>
    <p> </p>
    <p>
        <strong>文本格式化标签</strong>，<b>字体加粗</b>，<i>斜体</i>，<u>下划线</u>，<s>删除线</s>
    </p>

    <ul>
        <li>无序列表元素1</li>
        <li>无序列表元素2</li>
        <li>无序列表元素3</li>        
    </ul>

    <ol>
        <li>有序列表元素1</li>
        <li>有序列表元素2</li>
        <li>有序列表元素3</li>
    </ol>
    <h3>table row</h3>
    <h3>table header</h3>
    <h3>table data</h3>
    <table border="2">
        <tr>
            <th>列标题1</th>
            <th>列标题2</th>
            <th>列标题3</th>
        </tr>
        <tr>
            <td>i</td>
            <td>love</td>
            <td>you</td>
        </tr>
    </table>


    




</body>

</html>
