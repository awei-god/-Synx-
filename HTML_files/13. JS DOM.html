<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS DOM</title>
</head>
<body>
    <div id="box1">这是一个id选择器标签</div>
    <div class="box2">这是一个类选择器标签</div>
    <div>普通的div标签</div>
    <button>点击按钮</button>
    <script>
        let element_id=document.getElementById('box1');//id一般唯一，所以返回形式一般是单一变量
        console.log(element_id);
        
        let element_class=document.getElementsByClassName('box2')[0];//class是类别，一般不唯一，返回的是一个数组，而加上索引值，就是取其中一个，这跟c语言的差不多
        console.log(element_class);

        let element_tag=document.getElementsByTagName('div')[2];//与class同理
        console.log(element_tag);

        element_id.innerHTML = '修改ID选择器文本内容';
        // 这行代码的意思是：把 element_id 这个元素的内部 HTML 内容替换成字符串 '修改ID选择器文本内容'
        //innerHTML可以解析标签名，而textContent不能

        element_class.innerText='修改后的类选择文本';

        element_tag.style.color='red';
        element_tag.style.fontSize='20px';
        //style.fontSize 期望的值是 CSS 字符串.并且20px 不是 JavaScript 里的数字，而是一个带单位的字符串。
        //单引号，双引号都可以

        let button_element=document.getElementsByTagName('button')[0];
        button_element.onclick=function()/*这是一个匿名函数*/{
            alert('DOM 属性按键触发');
        }

        button_element.addEventListener("click",function(){
            alert("通过addEventListener触发按键");
        })
    </script>
</body>
</html>
