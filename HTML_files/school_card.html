<!DOCTYPE html>
<html>
    <head>
        <!--备注-->
        <meta charset="zh=CN">
        <title>校园活动</title>
        <style>
            body{
                font-family: sans-serif;/*设置字体为无衬线字体*/

                background: #f5f5f5;/*设置背景颜色为浅灰色，#f5f5f5 是十六进制颜色值*/

                padding: 20px;/*设置内边距为 20 像素，表示上下左右四个方向都是 20px*/
            }
            div{
                background: white;
                border-radius: 16px;/*设置圆角半径为 12 像素，四个角都会变圆*/
                padding: 20px;
                max-width: 400px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.1);/*设置盒子阴影*/
                /*0	水平阴影偏移量为 0
                2px	垂直阴影向下偏移 2px
                8px	阴影模糊半径为 8px
                rgba(0,0,0,0.1)	阴影颜色是黑色，透明度为 0.1，也就是很淡的黑色*/
            }
            span{
                background: #e0f0ff;
                color: #0066cc;
                padding: 2px 8px;
                border-radius: 6px;
                font-size: 13px;
            }
            button{
                margin-right: 8px;
                padding: 6px 14px;
                border: none;/*去掉元素的所有边框。*/
                border-radius: 6px;
                background: #0066cc;
                color: white;
                cursor:pointer;/*当鼠标移到这个元素上时，鼠标指针变成手型，提示用户“这里可以点击”。*/
            }
        </style>
    </head>

    <body>
        <h1>校园活动展示</h1>
        <p>这是第一张卡片。</p>
        <div>
            <h2>校园歌手大赛</h2>
            <span>文体活动</span>
            <p>一年一度的校园歌手大赛，欢迎报名参加</p>
            <button>点赞 (0)</button>
            <button>查看更多</button>
            <div id="detail" style="display: none;">/*display: none; 让元素不显示*/
                <p>活动规则：每人限报一首歌，初赛清唱，决赛带伴奏。</p>

            </div>
        </div>
    </body>
</html>
