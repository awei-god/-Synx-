<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS基本语法</title>
</head>
<body>
    <script>
        //变量
        var x;//声明变量,具有函数作用域，避免使用！！
        let y=5;//同上，具有块级作用域，更加安全和灵活
        const PI =3.14;
        console.log(x,y,PI);
        let name = '如花';//声明字符串
        console.log(name);
        let empty_value=null;
        console.log(empty_value);
        
        //undefined表示一个变量已经被声明但是尚未被赋值，或者一个对象属性不存在，返回的也是undefined
        //null表示一个变量被明确赋值为空或者不存在了，它是一个被赋予的值，表示一个空对象引用或者没有对象值

        //控制语句
        //判断语句：if else & else if 
        let a = 18;
        if(a>=18){
            console.log("已成年"); 
        }
        else{
            console.log("未成年");
            
        }

        let time=12;
        if(time>=12){
            alert("下午好");
            
        }

        //循环语句：for循环
        


    </script>
    
</body>
</html>
