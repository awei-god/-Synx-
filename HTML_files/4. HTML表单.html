<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4. HTML表单</title>
</head>
<body>

    <form action="">
        <label for="username">用户名：</label>
        <input type="text" placeholder="请输入内容" id="username">
        <br>
        <br>
        <label for="password">密码：</label>
        <input type="password" placeholder="请输入内容" id="password"><br><br>

        <!--单选-->
        <label for="">性别:</label>
        <input type="radio" name="gender">男
        <input type="radio" name="gender">女
        <input type="radio" name="gender">不愿透露<br><br>

        <!--多选-->
        <label for="">爱好：</label>
        <input type="checkbox" name="hobby">唱歌
        <input type="checkbox" name="hobby">跳舞
        <input type="checkbox" name="hobby">打篮球
        <input type="checkbox" name="hobby">看动漫<br><br>

        <input type="submit" value="上传">
        
    </form>

    
</body>
</html>
